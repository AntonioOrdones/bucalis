name: Compilar para publicar pela branch gh-pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: compilar-site2
  cancel-in-progress: false

jobs:
  build:
    name: Testar e preparar a branch de publicacao
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo-fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Obter base correta do GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Validar codigo e testes
        run: npm run lint && npm test

      - name: Compilar React e gerar paginas HTML
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Conferir site compilado
        run: |
          npm run check
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/sitemap.xml
          test -d dist/assets
          if grep -q 'src/entry-client.jsx' dist/index.html; then
            echo 'Erro: index.html ainda aponta para codigo React nao compilado'
            exit 1
          fi

      # Os arquivos da main sao fonte React, nao devem ser publicados diretamente.
      # A branch gh-pages contem exclusivamente o resultado compilado (dist).
      # Settings > Pages > Source = Deploy from a branch; Branch = gh-pages / (root).
      - name: Atualizar branch gh-pages com HTML compilado
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site2-publicado"
          cp -a dist/. "$RUNNER_TEMP/site2-publicado/"
          touch "$RUNNER_TEMP/site2-publicado/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi

          git rm -r -f --ignore-unmatch .
          git clean -fdx
          cp -a "$RUNNER_TEMP/site2-publicado/." ./
          git add -A

          if git diff --cached --quiet; then
            echo "Os arquivos publicados ja estao atualizados."
          else
            git commit -m "publish: site2 compilado da main ${GITHUB_SHA}"
            git push origin gh-pages
          fi
