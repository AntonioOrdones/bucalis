name: Compilar site na branch main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site2-main
  cancel-in-progress: false

jobs:
  build:
    name: Testar e atualizar arquivos estaticos da main
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar qualidade
        run: npm run lint && npm test

      - name: Compilar e pre-renderizar
        run: npm run build
        env:
          BASE_PATH: /bucalis/
          SITE_URL: https://antonioordones.github.io/bucalis

      - name: Verificar o resultado
        run: |
          npm run check
          test -s dist/index.html
          test -s dist/404.html
          test -d dist/assets
          if grep -q 'src/entry-client.jsx' dist/index.html; then
            echo 'index.html ainda referencia codigo React nao compilado'
            exit 1
          fi

      # GitHub Pages: Settings > Pages > Deploy from a branch > main > /(root).
      # O codigo React permanece em src/ e o template em template.html.
      - name: Sincronizar arquivos compilados na main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publicados=(
            index.html 404.html .nojekyll assets icons favicon.svg og-image.jpg
            sitemap.xml robots.txt site.webmanifest
            acessibilidade clinica contato convenios privacidade termos tratamentos
          )
          git rm -r -f --ignore-unmatch -- "${publicados[@]}"
          cp -a dist/. ./
          touch .nojekyll
          git add -A -- "${publicados[@]}"

          if git diff --cached --quiet; then
            echo "O site estatico da main ja esta atualizado."
          else
            git commit -m "publish: atualizar HTML compilado na main [skip ci]"
            # Uma alteracao pode chegar enquanto a compilacao esta rodando.
            # Nao sobrescreve outros commits: rebase com a main atual.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main

            # Commits do GITHUB_TOKEN nao disparam build do Pages por branch.
            # A API permite solicitar explicitamente a atualizacao.
            tipo="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || true)"
            if [ "$tipo" = "legacy" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
              echo "Atualizacao do GitHub Pages solicitada."
            fi
          fi
